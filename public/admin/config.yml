# Decap CMS Configuration
# Documentation: https://decapcms.org/docs/configuration-options/
#
# Authentication: self-hosted GitHub OAuth proxy
# backend.name is set to "github" as specified
# backend.base_url points to our own Vercel serverless OAuth proxy
# DO NOT use netlify-identity or DecapBridge (both are external dependencies)

backend:
  name: github
  # TODO: Replace with your actual GitHub repo path (e.g. "your-username/path-site")
  repo: ggininder-978/path-site
  branch: main
  # TODO: Replace with your deployed Vercel project URL (e.g. "https://path-site.vercel.app")
  # This must match the "Homepage URL" in your GitHub OAuth App settings
  base_url: https://path-site-gilt.vercel.app
  auth_endpoint: /api/auth

site_url: https://path-site-gilt.vercel.app
display_url: https://path-site-gilt.vercel.app

# Media files — uploaded images go here (relative to project root)
media_folder: public/images/eats/puli
public_folder: /images/eats/puli

# Use URL-safe filenames for uploaded media and article slugs.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Locale for the CMS editor UI
locale: zh_Hant

# Disable draft saving in editorial workflow for simplicity
# (the "draft" field in content handles unpublished state)
publish_mode: simple

collections:
  - name: eats
    label: 食記文章
    label_singular: 食記文章
    folder: src/content/eats/puli
    create: true
    slug: "{{slug}}"
    # Filename will be the article slug (auto-generated from title)
    extension: md
    format: frontmatter
    fields:
      - label: 標題
        name: title
        widget: string
        hint: 文章頁面上的 H1 標題，建議自然包含主要關鍵字，例如「埔里美食推薦」。

      - label: SEO 標題 Title Tag
        name: seoTitle
        widget: string
        required: false
        hint: 顯示在 Google 搜尋結果和瀏覽器分頁，可和文章標題不同；建議 25–35 個中文字，放入主要關鍵字。

      - label: 摘要 / Meta Description
        name: description
        widget: string
        hint: 簡短說明這篇文章的內容，會顯示在 Google 搜尋結果標題下方；建議 60–120 個中文字，包含主要關鍵字與吸引點。

      - label: 目標關鍵字
        name: keyword
        widget: string
        hint: 這篇文章主要針對的 SEO 關鍵字，例如「埔里美食」、「埔里早午餐」、「埔里旅遊」。

      - label: 次要關鍵字
        name: secondaryKeywords
        widget: list
        required: false
        summary: "{{fields.keyword}}"
        field:
          label: 關鍵字
          name: keyword
          widget: string
        hint: 補充 2–5 個相關關鍵字，例如「埔里小吃」、「埔里餐廳推薦」、「南投埔里美食」。

      - label: 地點 (中文顯示名稱)
        name: locationName
        widget: string
        default: 埔里
        hint: 文章對應的城市或地區中文名稱（預設「埔里」）

      - label: 網址代碼 (英文Slug)
        name: locationSlug
        widget: select
        options: ["puli"]
        default: "puli"
        hint: 這會構成網址的一部份，請勿隨意填寫（目前預設 puli）

      - label: 封面圖片
        name: coverImage
        widget: image
        required: false
        hint: 上傳文章封面圖片（會用於 Google / 社群媒體預覽）

      - label: 封面圖片 Alt 文字
        name: coverAlt
        widget: string
        required: false
        hint: 圖片替代文字 Alt Text。請描述圖片實際內容，最好自然包含地點或店名，例如「製飯糰埔里店明太子炸蝦飯糰」。

      - label: 社群分享標題
        name: ogTitle
        widget: string
        required: false
        hint: 分享到 LINE、Facebook、Threads 等平台時的標題；不填則使用 SEO 標題或文章標題。

      - label: 社群分享描述
        name: ogDescription
        widget: string
        required: false
        hint: 分享連結時顯示的描述；不填則使用 Meta Description。

      - label: 社群分享圖片
        name: ogImage
        widget: image
        required: false
        hint: 分享連結預覽用圖片；不填則使用封面圖片。

      - label: 社群分享圖片 Alt 文字
        name: ogImageAlt
        widget: string
        required: false
        hint: 描述社群分享圖片內容；不填則使用封面圖片 Alt 文字。

      - label: Canonical URL
        name: canonicalUrl
        widget: string
        required: false
        hint: 只有文章有重複來源或指定正式網址時才需要填；一般情況請留空。

      - label: 不讓搜尋引擎索引
        name: noindex
        widget: boolean
        default: false
        hint: 測試頁、活動暫存頁才開啟；正式 SEO 文章請保持關閉。

      - label: 發布日期
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: ""

      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 開啟「草稿」代表這篇文章不會公開顯示，可以先儲存、之後再發布

      - label: 文章內文
        name: body
        widget: markdown
        hint: 在這裡撰寫文章內容。插入圖片時請填圖片替代文字 Alt Text，Markdown 格式是：![圖片描述](圖片網址)。

      - label: SEO 上稿檢查
        name: seoChecklist
        widget: object
        required: false
        collapsed: true
        hint: 發布前確認用，不會顯示在前台。
        fields:
          - label: 標題含主要關鍵字
            name: titleIncludesKeyword
            widget: boolean
            default: false
          - label: Meta Description 含主要關鍵字
            name: descriptionIncludesKeyword
            widget: boolean
            default: false
          - label: H2 / H3 小標含相關關鍵字
            name: headingsIncludeKeywords
            widget: boolean
            default: false
          - label: 文章圖片都有 Alt 文字
            name: imagesHaveAltText
            widget: boolean
            default: false
          - label: 已加入相關內部連結
            name: internalLinksAdded
            widget: boolean
            default: false
